version: 2

# Dependabot's default subject is `build(deps): Bump X from A to B`, and
# `build` is not one of the types CONTRIBUTING.md lists. The prefix below makes
# the proposed commits conform on arrival rather than needing a rewritten
# subject at merge time.
#
# One thing Dependabot cannot do for us: nexus/ replaces the core module with
# the working tree, so a bump here reaches its build list too, but Dependabot
# scans the two go.mod files as separate ecosystems and updates only the one it
# found the dependency in. A root bump therefore usually needs a follow-up
# `make tidy` commit on the branch. CI's `go mod tidy` diff check catches it;
# see CONTRIBUTING.md.
updates:
  # The core module. Nothing here may pull in Nexus, so a bump that appears in
  # this file and not in the one below is the separation working.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  # The Nexus integration is a separate Go module with its own go.mod, and
  # Dependabot only scans the directories it is told about. Without this entry
  # the module that has the largest dependency tree is the one nothing watches.
  - package-ecosystem: gomod
    directory: /nexus
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - nexus

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - ci
