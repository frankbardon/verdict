# Verdict configuration.
#
# Every key below is shown at its default. A configuration file only needs the
# keys it changes: what it does not mention keeps the default, so a three-line
# file is a complete file.
#
# The block may be nested under `verdict:` (so it can live inside a host
# application's own configuration) or supplied at the top level (for a
# standalone `verdict serve` config). Both are accepted.

verdict:
  feel:
    # "feel" is DMN Conformance Level 3 — the full language.
    # "s-feel" is Level 2: decision tables and simple expressions only, with
    # iteration, conditionals and inline functions rejected at parse time.
    # A model that declares its own conformanceLevel overrides this for itself.
    dialect: feel

    # The location now(), today() and date arithmetic resolve against. UTC by
    # default: a decision that means something different depending on where it
    # ran is not auditable. An IANA zone here also names now()'s zone:
    # `Europe/Paris` makes now() `...@Europe/Paris` with
    # now().timezone = "Europe/Paris"; UTC makes it `...Z`, .timezone null.
    timezone: UTC

    # The iteration budget of one request: the total number of elements every
    # `for`, `some` and `every` iteration context may produce across
    # everything the request evaluates — every decision in the slice
    # (parallel siblings included), every business knowledge model, boxed
    # function and decision service invoked from FEEL, every unary test.
    # Integer ranges (`1..n`) and list domains count alike, with nested and
    # multi-context products (`for i in 1..n, j in 1..n`) counted in full, so
    # n×n is charged n² — and `for i in 1..n return bkm(i)` is charged n plus
    # the work of all n calls. It is per request, not per expression, because
    # a budget that reset on every function call would let a loop of calls
    # multiply it. Exceeding it fails the evaluation (VERDICT_EVAL_005); an
    # integer range is refused before any element is built. A million is far
    # beyond what a decision model iterates on purpose — a day-by-day loop
    # over a century is under 40,000 — and bounds a request's lists to
    # roughly a hundred megabytes, so a model loaded through `verdict serve`
    # cannot exhaust the server's memory. Each request gets the whole budget.
    # 0 means this default; negative is rejected. There is no unlimited
    # setting: raise the budget instead.
    max_iterations: 1000000

  evaluation:
    # Refuse to load a model whose static analysis reports an error — an
    # overlap under UNIQUE, a gap under a non-defaulted policy, an expression
    # that does not compile. Turn this on in production.
    strict_mode: false

    # Bounds an agent decision that declares no maxLatency of its own. The
    # model's own policy always wins where it sets one.
    default_max_latency: 30s

    # Evaluate independent decisions in the same dependency layer concurrently.
    parallel_independent_decisions: true

    # Cache referentially transparent nodes on their inputs, within one
    # evaluation. Agent decisions are never memoised.
    memoize: false

    # Bounds recursion through decision services.
    max_depth: 32

  tracing:
    # off | summary | full. The trace is the deliverable, so full is the
    # default; summary keeps the graph and timings but drops the values.
    mode: full

    # Binding names whose values are replaced with "[redacted]" in the trace.
    # Redaction is a trace concern only — the decision still sees the real
    # value, so redacting an input does not change the outcome.
    redact_inputs: []

  agent:
    # nexus | http | mock | none. Empty means the host wires a bridge in code,
    # which is the library-first path. "nexus" is only available to a program
    # that imports the separate github.com/frankbardon/verdict/nexus module.
    bridge: ""

    http:
      endpoint: ""
      headers: {}
      timeout: 60s

    # Read by the verdict/nexus module; ignored by the core.
    nexus:
      # per-decision  — every agent node gets its own session. Maximum
      #                 isolation; the default.
      # per-evaluation — one session per evaluation, so later nodes see what
      #                 earlier ones were asked.
      # shared        — one long-lived session. Best-informed, and the only
      #                 strategy where one request's data can reach another's
      #                 prompt.
      session_strategy: per-decision
      channel: verdict

  models:
    # Files or directories to load at startup. Directories are scanned
    # non-recursively for *.dmn, *.xml, *.json and *.vdj.
    # There is no hot-reload option: loading is content-addressed and
    # idempotent, so a host that wants it can watch files and reload itself.
    paths: []

  # Only read by `verdict serve` and `verdict mcp`; the library ignores this block.
  server:
    listen: ":7430"
    twirp_path: /twirp
    mcp_enabled: true
    read_timeout: 30s
    write_timeout: 60s
